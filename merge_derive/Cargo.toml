[package]
name = "merge_derive"
version = "0.2.0"
authors = ["Robin Krahl <robin.krahl@ireas.org>"]
edition = "2021"
rust-version = "1.70"
description = "Derive macro for the merge::Merge trait"
repository = "https://git.sr.ht/~ireas/merge-rs/tree/master/merge_derive"
keywords = ["merge", "macros", "derive"]
categories = ["rust-patterns"]
readme = "README.md"
license = "Apache-2.0 OR MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
proc-macro-error3 = { version = "3.1", default-features = false, features = ["syn2-error"] }
quote = "1.0"
syn = "2.0"
